<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8th Wall Face Filter</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- 8th Wall Engine (Local Open Source Binary) -->
  <script src="xr-engine/xr.js" data-preload-chunks="face"></script>

  <!-- Immediate Shim and Explicit Load -->
  <script>
    window.addEventListener('xrloaded', () => {
      if (window.XR && !window.XR8) window.XR8 = window.XR;
    });
  </script>

  <!-- 8th Wall XRExtras -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js"></script>

  <link rel="stylesheet" href="style.css">
  <style>
    #camera-selector-container {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10000;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 8px;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    #camera-select {
      background: #333;
      color: white;
      border: 1px solid #555;
      padding: 5px;
      border-radius: 4px;
      outline: none;
    #status-log {
      margin-top: 10px;
      font-size: 10px;
      color: #aaa;
      max-height: 100px;
      overflow-y: auto;
    }
  </style>
</head>

<body>
  <div id="camera-selector-container">
    <label for="camera-select">Select Camera:</label>
    <select id="camera-select">
      <option>Requesting devices...</option>
    </select>
    <div id="status-log">Status: Initializing...</div>
  </div>

  <a-scene xrextras-runtime-error renderer="maxCanvasWidth: 960; maxCanvasHeight: 960"
    xrface="mirroredDisplay: true; meshGeometry: face, eyes, mouth; allowedDevices: any;">

    <a-assets timeout="30000">
      <!-- No external textures for now to avoid 404 -->
    </a-assets>

    <a-camera id="camera" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>

    <!-- Face Anchor -->
    <xrextras-faceanchor>
      <!-- Face Mesh with color -->
      <xrextras-face-mesh material="color: #FF3B30; transparent: true; opacity: 0.3"></xrextras-face-mesh>

      <!-- Simple 3D Object attached to nose -->
      <xrextras-face-attachment point="noseBridge">
        <a-sphere radius="0.04" color="#FF3B30" position="0 0.02 0"></a-sphere>
      </xrextras-face-attachment>

      <!-- Mouth Attachment -->
      <xrextras-face-attachment point="mouthCenter">
        <a-entity id="mouth-ball" visible="false">
          <a-sphere radius="0.05" color="#007AFF"></a-sphere>
          <a-text value="OPEN!" align="center" position="0 0.1 0" scale="0.2 0.2 0.2" color="white"></a-text>
        </a-entity>
      </xrextras-face-attachment>
    </xrextras-faceanchor>

    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" position="0 2 2" intensity="0.5"></a-light>
  </a-scene>

  <script>
    const scene = document.querySelector('a-scene')

    const onFaceUpdate = (event) => {
      const mouthBall = document.getElementById('mouth-ball')
      if (mouthBall) {
        const { face } = event.detail
        console.log('Face Data:', face)
        const openness = face.mouthOpenness || face.mouthOpen || 0
        mouthBall.setAttribute('visible', openness > 0.1)
      }
    }

    scene.addEventListener('xrfaceupdated', onFaceUpdate)
    window.addEventListener('xrfaceupdated', onFaceUpdate)

    const statusLog = document.getElementById('status-log')
    const log = (msg) => {
      console.log(msg)
      statusLog.innerText = msg
    }

    // Camera Selection Logic
    const cameraSelect = document.getElementById('camera-select')
    
    const updateCameraList = async () => {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices()
        const videoDevices = devices.filter(d => d.kind === 'videoinput')
        
        cameraSelect.innerHTML = ''
        videoDevices.forEach(device => {
          const option = document.createElement('option')
          option.value = device.deviceId
          option.text = device.label || `Camera ${cameraSelect.length + 1}`
          if (device.deviceId === localStorage.getItem('preferredCameraId')) {
            option.selected = true
          }
          cameraSelect.appendChild(option)
        })
        log('Cameras listed: ' + videoDevices.length)
      } catch (err) {
        log('Error listing cameras: ' + err.message)
      }
    }

    cameraSelect.addEventListener('change', () => {
      localStorage.setItem('preferredCameraId', cameraSelect.value)
      log('Camera changed. Reloading...')
      window.location.reload()
    })

    // Global Error Handler
    window.addEventListener('error', (e) => {
      log('Global Error: ' + e.message)
    })

    // Wait for 8th wall to start (and have permissions) before listing labels
    window.addEventListener('xrloaded', () => {
      log('8th Wall Loaded (xrloaded)')
      if (window.XR && !window.XR8) window.XR8 = window.XR
      
      // Intercept XR8.run to inject deviceId if we have one
      const originalRun = XR8.run
      XR8.run = function(config) {
        log('XR8.run called')
        const preferredId = localStorage.getItem('preferredCameraId')
        if (preferredId) {
          config.deviceId = preferredId
          log('Using deviceId: ' + preferredId.substring(0, 8) + '...')
        }
        
        // Remove cameraDirection for PC/Standalone to avoid "front" constraint
        if (config.cameraDirection) {
          log('Removing cameraDirection constraint: ' + config.cameraDirection)
          delete config.cameraDirection
        }

        // Force desktop support if needed
        if (!config.allowedDevices) config.allowedDevices = 'any'
        
        log('Final Config: ' + JSON.stringify(config))
        return originalRun.apply(this, arguments)
      }
    })

    scene.addEventListener('xrsessionstarted', () => log('Session Started'))
    scene.addEventListener('xrsessionended', () => log('Session Ended'))
    scene.addEventListener('xrerror', (e) => log('XR Error: ' + e.detail.error))

    // Periodically check for labels (permissions might be granted later)
    setInterval(updateCameraList, 3000)
    updateCameraList()
  </script>
</body>

</html>
