<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8th Wall Face Filter</title>

  <!-- Aggressive XR8 Shim -->
  <script>
    (function () {
      var _xr;
      Object.defineProperty(window, 'XR8', {
        get: function () { return _xr || window.XR; },
        set: function (v) { _xr = v; if (!window.XR) window.XR = v; },
        configurable: true
      });
      Object.defineProperty(window, 'XR', {
        get: function () { return _xr; },
        set: function (v) { _xr = v; if (!window.XR8) window.XR8 = v; },
        configurable: true
      });
    })();
  </script>

  <!-- 8th Wall Engine -->
  <script src="xr-engine/xr.js" data-preload-chunks="face"></script>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- 8th Wall XRExtras -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- On-screen Debug Log -->
  <div id="debug-log"
    style="position: fixed; top: 0; left: 0; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; font-size: 10px; z-index: 10000; width: 100%; max-height: 200px; overflow-y: auto; padding: 5px;">
    <button onclick="switchCamera()"
      style="background: #0f0; color: #000; border: none; padding: 5px; margin-right: 5px; cursor: pointer; font-weight: bold;">🔄
      SWITCH</button>
    <button onclick="forceStart()"
      style="background: #fff; color: #000; border: none; padding: 5px; cursor: pointer; font-weight: bold;">🚀 FORCE
      START</button><br>
  </div>

  <a-scene xrextras-loading xrextras-runtime-error renderer="antialias: true; alpha: true;"
    xrface="apiKey: local-test; mirroredDisplay: true; meshGeometry: face, eyes, mouth; cameraDirection: front; allowedDevices: any;">

    <a-assets timeout="30000">
    </a-assets>

    <a-camera id="camera" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>

    <!-- Face Anchor -->
    <xrextras-faceanchor>
      <xrextras-face-mesh material="color: #FF3B30; transparent: true; opacity: 0.3"></xrextras-face-mesh>
      <xrextras-face-attachment point="noseBridge">
        <a-sphere radius="0.04" color="#FF3B30" position="0 0.02 0"></a-sphere>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="mouthCenter">
        <a-entity id="mouth-ball" visible="false">
          <a-sphere radius="0.05" color="#007AFF"></a-sphere>
          <a-text value="OPEN!" align="center" position="0 0.1 0" scale="0.2 0.2 0.2" color="white"></a-text>
        </a-entity>
      </xrextras-face-attachment>
    </xrextras-faceanchor>

    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" position="0 2 2" intensity="0.5"></a-light>
  </a-scene>

  <script>
    const log = (msg) => {
      const el = document.getElementById('debug-log');
      el.innerHTML += `> ${msg}<br>`;
      el.scrollTop = el.scrollHeight;
      console.log(msg);
    };

    const scene = document.querySelector('a-scene')

    const onFaceUpdate = (event) => {
      const mouthBall = document.getElementById('mouth-ball')
      if (mouthBall) {
        const { face } = event.detail
        const openness = face.mouthOpenness || face.mouthOpen || 0
        mouthBall.setAttribute('visible', openness > 0.1)
      }
    }

    scene.addEventListener('xrfaceupdated', onFaceUpdate)

    let currentCamIndex = 0;
    let videoDevices = [];

    window.forceStart = () => {
      const canvas = document.querySelector('canvas') || scene.canvas;
      if (!canvas) {
        log('❌ No Canvas found to start engine');
        return;
      }
      log('🚀 Forcing Engine Run...');
      const deviceId = videoDevices[currentCamIndex] ? videoDevices[currentCamIndex].deviceId : undefined;
      XR8.run({ canvas, deviceId });
    };

    window.switchCamera = () => {
      if (videoDevices.length === 0) return;
      currentCamIndex = (currentCamIndex + 1) % videoDevices.length;
      log(`🔄 Selected: ${videoDevices[currentCamIndex].label || 'Camera ' + currentCamIndex}`);
      window.forceStart();
    };

    window.addEventListener('xrloaded', () => {
      log('✅ XR Engine Loaded')
      navigator.mediaDevices.enumerateDevices().then(devices => {
        videoDevices = devices.filter(d => d.kind === 'videoinput');
        log(`Cameras found: ${videoDevices.length}`);

        // Auto-find EMEET
        const emeetIndex = videoDevices.findIndex(d => d.label.includes('EMEET'));
        if (emeetIndex !== -1) {
          currentCamIndex = emeetIndex;
          log(`🎯 Auto-selected EMEET (Index ${emeetIndex})`);
        }

        videoDevices.forEach((c, i) => log(`${i}: ${c.label || 'Unnamed'}`));
      });
    })

    window.addEventListener('cameraerror', (event) => {
      log(`❌ Camera Error: ${JSON.stringify(event.detail)}`)
    })

    scene.addEventListener('camerastart', (event) => {
      log('✅ Camera Started')
    })

    scene.addEventListener('realityerror', (event) => {
      log(`❌ Reality Error: ${JSON.stringify(event.detail)}`)
    })
  </script>
</body>

</html>
