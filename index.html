<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8th Wall Face Filter</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- 8th Wall Engine (Local Open Source Binary) -->
  <script src="xr-engine/xr.js" data-preload-chunks="face"></script>

  <!-- Immediate Shim and Explicit Load -->
  <script>
    window.addEventListener('xrloaded', () => {
      if (window.XR && !window.XR8) window.XR8 = window.XR;
      if (window.XR8 && window.XR8.FaceController) {
        const config = XR8.FaceController.configure({maxDetections: 3, segmentation: true})
        log(`XR Config: max=${config.maxDetections} seg=${config.segmentation}`)
      }
      if (!AFRAME.components['xrextras-face-background']) {
        log('WARNING: xrextras-face-background component not found!')
        const xrextras = Object.keys(AFRAME.components).filter(c => c.startsWith('xrextras'))
        log(`Available: ${xrextras.join(', ')}`)
      } else {
        log('xrextras-face-background component ready.')
      }
      const bgImg = document.getElementById('bg')
      if (bgImg.complete) log('BG Image Loaded')
      else {
        bgImg.onload = () => log('BG Image Load Success')
        bgImg.onerror = () => log('BG Image Load ERROR')
      }
      // Unlock audio after XR loads (camera permission = user gesture)
      const tryUnlock = () => {
        const song = document.getElementById('song')
        if (song && song.paused) {
          song.play().then(() => {
            song.pause()
            log('Audio unlocked via XR')
          }).catch(() => {})
        }
      }
      // Try on XR start events
      window.addEventListener('xrpermissiongranted', tryUnlock, {once: true})
      window.addEventListener('xrmountedxr', tryUnlock, {once: true})
      setTimeout(tryUnlock, 3000) // fallback
    });
  </script>

  <!-- 8th Wall XRExtras -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras/dist/xrextras.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a-scene xrextras-runtime-error xrextras-face-tracking renderer="maxCanvasWidth: 960; maxCanvasHeight: 960"
    xrface="maxDetections: 3; mirroredDisplay: true; meshGeometry: face, eyes, mouth; cameraDirection: front; allowedDevices: any; segmentation: true;">

    <a-assets timeout="30000">
      <!-- Background Image -->
      <img id="bg" src="Images/coco_background.jpg">
      <!-- Local song -->
      <audio id="song" src="Music/horse.mp3" loop></audio>
    </a-assets>

    <a-sky src="#bg"></a-sky>

    <a-camera id="camera" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>

    <!-- Face Anchor 0 -->
    <xrextras-faceanchor face-id="0" face-mouth-handler="faceId: 0">
      <xrextras-face-mesh material="shader: video; useCameraTexture: true"></xrextras-face-mesh>
      <xrextras-face-attachment point="noseBridge">
        <a-sphere radius="0.04" color="#FF3B30" position="0 0.02 0"></a-sphere>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="mouthCenter">
        <a-entity class="mouth-ball" visible="false">
          <a-sphere radius="0.05" color="#007AFF"></a-sphere>
          <a-text value="OPEN!" align="center" position="0 0.1 0" scale="0.2 0.2 0.2" color="white"></a-text>
        </a-entity>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="leftEye">
        <a-sphere class="eye-ball" radius="0.05" color="#FF3B30" visible="false" position="0 0 0.05"></a-sphere>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="rightEye">
        <a-sphere class="eye-ball" radius="0.05" color="#FF3B30" visible="false" position="0 0 0.05"></a-sphere>
      </xrextras-face-attachment>
    </xrextras-faceanchor>

    <!-- Face Anchor 1 -->
    <xrextras-faceanchor face-id="1" face-mouth-handler="faceId: 1">
      <xrextras-face-mesh material="shader: video; useCameraTexture: true"></xrextras-face-mesh>
      <xrextras-face-attachment point="noseBridge">
        <a-sphere radius="0.04" color="#FF3B30" position="0 0.02 0"></a-sphere>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="mouthCenter">
        <a-entity class="mouth-ball" visible="false">
          <a-sphere radius="0.05" color="#007AFF"></a-sphere>
          <a-text value="OPEN!" align="center" position="0 0.1 0" scale="0.2 0.2 0.2" color="white"></a-text>
        </a-entity>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="leftEye">
        <a-sphere class="eye-ball" radius="0.05" color="#FF3B30" visible="false" position="0 0 0.05"></a-sphere>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="rightEye">
        <a-sphere class="eye-ball" radius="0.05" color="#FF3B30" visible="false" position="0 0 0.05"></a-sphere>
      </xrextras-face-attachment>
    </xrextras-faceanchor>

    <!-- Face Anchor 2 -->
    <xrextras-faceanchor face-id="2" face-mouth-handler="faceId: 2">
      <xrextras-face-mesh material="shader: video; useCameraTexture: true"></xrextras-face-mesh>
      <xrextras-face-attachment point="noseBridge">
        <a-sphere radius="0.04" color="#FF3B30" position="0 0.02 0"></a-sphere>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="mouthCenter">
        <a-entity class="mouth-ball" visible="false">
          <a-sphere radius="0.05" color="#007AFF"></a-sphere>
          <a-text value="OPEN!" align="center" position="0 0.1 0" scale="0.2 0.2 0.2" color="white"></a-text>
        </a-entity>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="leftEye">
        <a-sphere class="eye-ball" radius="0.05" color="#FF3B30" visible="false" position="0 0 0.05"></a-sphere>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="rightEye">
        <a-sphere class="eye-ball" radius="0.05" color="#FF3B30" visible="false" position="0 0 0.05"></a-sphere>
      </xrextras-face-attachment>
    </xrextras-faceanchor>

    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" position="0 2 2" intensity="0.5"></a-light>
  </a-scene>


  <script>
    const scene = document.querySelector('a-scene')
    const debugLog = document.getElementById('debug-log')

    const log = (msg) => {
      console.log(msg)
    }

    AFRAME.registerComponent('face-mouth-handler', {
      schema: {
        faceId: { type: 'number' }
      },
      init: function () {
        this.onUpdate = (e) => {
          if (e.detail.id === this.data.faceId) {
            this.updateMouth(e.detail.face)
          }
        }
        this.el.sceneEl.addEventListener('xrfaceupdated', this.onUpdate)
      },
      updateMouth: function (face) {
        const isOpen = (face.mouthOpenness || face.mouthOpen || 0) > 0.1
        const mouthBall = this.el.querySelector('.mouth-ball')
        const eyeBalls = this.el.querySelectorAll('.eye-ball')

        if (mouthBall) mouthBall.setAttribute('visible', isOpen)
        eyeBalls.forEach(ball => {
          ball.setAttribute('visible', isOpen)
          ball.setAttribute('scale', isOpen ? '1.5 1.5 1.5' : '1 1 1')
        })
      }
    })

    const activeFaces = new Set()
    const pauseSong = () => {
      const song = document.getElementById('song')
      if (song && playPromise) {
        playPromise.then(() => song.pause()).catch(() => {})
      } else if (song) {
        song.pause()
      }
    }

    scene.addEventListener('xrfacefound', (e) => {
      activeFaces.add(e.detail.id)
      log(`Faces: ${activeFaces.size} | Found: ${e.detail.id}`)
    })
    scene.addEventListener('xrfacelost', (e) => {
      activeFaces.delete(e.detail.id)
      log(`Faces: ${activeFaces.size} | Lost: ${e.detail.id}`)
      // No faces left → stop music
      if (activeFaces.size === 0) {
        openCount = 0
        pauseSong()
        log('All faces lost. Music stopped.')
      }
    })

    let openCount = 0
    let playPromise = null

    scene.addEventListener('xrmouthopened', () => {
      openCount++
      log(`Users: ${activeFaces.size} | Mouths: ${openCount}`)
      const song = document.getElementById('song')
      // Only play if face is actively detected
      if (song && openCount === 1 && activeFaces.size > 0) {
        playPromise = song.play()
        playPromise.catch(e => {
          if (e.name !== 'AbortError') log('Audio Error: ' + e.message)
        })
      }
    })

    scene.addEventListener('xrmouthclosed', () => {
      openCount = Math.max(0, openCount - 1)
      log(`Users: ${activeFaces.size} | Mouths: ${openCount}`)
      if (openCount === 0) pauseSong()
    })

    // Also unlock on first touchstart as final fallback
    window.addEventListener('touchstart', () => {
      const song = document.getElementById('song')
      if (song && song.paused) {
        song.play().then(() => song.pause()).catch(() => {})
      }
    }, {once: true})
  </script>
</body>

</html>
