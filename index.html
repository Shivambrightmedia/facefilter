<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>8th Wall Face Filter</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>

  <!-- 8th Wall Engine (Local Open Source Binary) -->
  <script src="xr-engine/xr.js" data-preload-chunks="face"></script>

  <!-- Immediate Shim and Explicit Load -->
  <script>
    window.addEventListener('xrloaded', () => {
      if (window.XR && !window.XR8) window.XR8 = window.XR;
    });
  </script>

  <!-- 8th Wall XRExtras -->
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1.0.0/dist/xrextras.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a-scene xrextras-runtime-error renderer="maxCanvasWidth: 960; maxCanvasHeight: 960"
    xrface="mirroredDisplay: true; meshGeometry: face, eyes, mouth; cameraDirection: front; allowedDevices: any;">

    <a-assets timeout="30000">
      <!-- Sample song -->
      <audio id="song" src="https://cdn.pixabay.com/audio/2022/03/10/audio_c8c8a7315b.mp3" loop></audio>
    </a-assets>

    <a-camera id="camera" look-controls="enabled: false" wasd-controls="enabled: false" position="0 1.6 0"></a-camera>

    <!-- Face Anchor -->
    <xrextras-faceanchor>
      <!-- Face Mesh with color -->
      <xrextras-face-mesh material="color: #FF3B30; transparent: true; opacity: 0.3"></xrextras-face-mesh>

      <!-- Simple 3D Object attached to nose -->
      <xrextras-face-attachment point="noseBridge">
        <a-sphere radius="0.04" color="#FF3B30" position="0 0.02 0"></a-sphere>
      </xrextras-face-attachment>

      <!-- Mouth Attachment -->
      <xrextras-face-attachment point="mouthCenter">
        <a-entity id="mouth-ball" visible="false">
          <a-sphere radius="0.05" color="#007AFF"></a-sphere>
          <a-text value="OPEN!" align="center" position="0 0.1 0" scale="0.2 0.2 0.2" color="white"></a-text>
        </a-entity>
      </xrextras-face-attachment>

      <!-- Eye Attachments -->
      <xrextras-face-attachment point="leftEye">
        <a-sphere class="eye-ball" radius="0.05" color="#FF3B30" visible="false" position="0 0 0.05"></a-sphere>
      </xrextras-face-attachment>
      <xrextras-face-attachment point="rightEye">
        <a-sphere class="eye-ball" radius="0.05" color="#FF3B30" visible="false" position="0 0 0.05"></a-sphere>
      </xrextras-face-attachment>
    </xrextras-faceanchor>

    <a-light type="ambient" intensity="1"></a-light>
    <a-light type="directional" position="0 2 2" intensity="0.5"></a-light>
  </a-scene>

    <!-- Debug UI -->
    <div id="debug-log" style="position: fixed; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); z-index: 1000; pointer-events: none; font-family: monospace; font-size: 12px; padding: 5px;"></div>

    <script>
      const scene = document.querySelector('a-scene')
      const debugLog = document.getElementById('debug-log')

      const log = (msg) => {
        debugLog.innerText = msg
        console.log(msg)
      }

      const onFaceUpdate = (event) => {
        const mouthBall = document.getElementById('mouth-ball')
        const eyeBalls = document.querySelectorAll('.eye-ball')
        const {face} = event.detail
        
        const openness = face.mouthOpenness || face.mouthOpen || 0
        const isOpen = openness > 0.1
        
        log(`Mouth: ${openness.toFixed(2)} | Open: ${isOpen}`)

        if (mouthBall) mouthBall.setAttribute('visible', isOpen)
        eyeBalls.forEach(ball => {
          ball.setAttribute('visible', isOpen)
          if (isOpen) ball.setAttribute('scale', '1.5 1.5 1.5')
          else ball.setAttribute('scale', '1 1 1')
        })
      }

      scene.addEventListener('xrfaceupdated', onFaceUpdate)
      
      scene.addEventListener('xrmouthopened', () => {
        log('Mouth Opened!')
        const mesh = document.querySelector('xrextras-face-mesh')
        if (mesh) mesh.setAttribute('material', 'color: #34C759; transparent: true; opacity: 0.6')
        
        const song = document.getElementById('song')
        if (song) song.play().catch(e => log('Audio Error: ' + e.message))
      })

      scene.addEventListener('xrmouthclosed', () => {
        log('Mouth Closed')
        const mesh = document.querySelector('xrextras-face-mesh')
        if (mesh) mesh.setAttribute('material', 'color: #FF3B30; transparent: true; opacity: 0.3')
        
        const song = document.getElementById('song')
        if (song) song.pause()
      })
    </script>
</body>

</html>
